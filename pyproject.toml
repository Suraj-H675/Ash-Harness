[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ash-ai"
version = "0.1.0"
description = "Extensible local AI agent harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suraj-H675" }]
keywords = ["agent", "ai", "coding-agent", "harness", "llm", "mcp", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "anthropic>=0.52",
    "croniter>=6.2.3,<7",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "loguru>=0.7",
    "openai>=1.82",
    "packaging>=24.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "prompt-toolkit>=3.0.51",
    "pyyaml>=6.0",
    "referencing>=0.35",
    "rich>=13.0",
    "tiktoken>=0.7",
    "toml>=0.10",
    "tree-sitter>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-typescript>=0.23",
    "tzdata>=2026.2",
    "cryptography>=44",
]

[project.urls]
Homepage = "https://github.com/Suraj-H675/Ash-Harness"
Repository = "https://github.com/Suraj-H675/Ash-Harness"
Changelog = "https://github.com/Suraj-H675/Ash-Harness/blob/main/CHANGELOG.md"
Issues = "https://github.com/Suraj-H675/Ash-Harness/issues"

[project.scripts]
ash = "ash.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ash*"]
namespaces = false

[tool.setuptools.package-data]
ash = ["py.typed"]
"ash.sandbox" = ["Dockerfile"]

[tool.uv]
package = true

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]
vector = [
    "chromadb>=1.0",
    "onnxruntime>=1.16",
]
browser = [
    "playwright>=1.61.0",
]
acp = [
    "agent-client-protocol>=0.11,<0.12",
]
a2a = [
    "a2a-sdk[http-server,sqlite]>=1.1,<1.2",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "mypy>=1.16",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.11",
    "types-croniter>=6.2.2.20260518",
    "types-protobuf>=6.30",
    "types-pyyaml>=6.0",
    "uvicorn>=0.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.ruff]
extend-exclude = ["project", "ref"]
