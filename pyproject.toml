[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ash-ai"
version = "0.1.0"
description = "Extensible local AI agent harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "loguru>=0.7",
    "openai>=1.82",
    "packaging>=24.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "prompt-toolkit>=3.0.51",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tiktoken>=0.7",
    "toml>=0.10",
    "tree-sitter>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.scripts]
ash = "ash.cli:main"

[tool.setuptools]
packages = ["ash", "agents", "cli", "context", "core", "hooks", "lsp", "mcp", "memory", "plugins", "providers", "repo", "safety", "sandbox", "server", "tools", "ui"]
py-modules = ["ash_logging", "config", "exceptions"]

[tool.setuptools.package-data]
sandbox = ["Dockerfile"]

[tool.uv]
package = true

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]
vector = [
    "chromadb>=1.0",
    "onnxruntime>=1.16",
]
browser = [
    "playwright>=1.61.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "mypy>=1.16",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.11",
    "types-pyyaml>=6.0",
    "uvicorn>=0.34",
]

[project.urls]
Repository = "https://github.com/Suraj-H675/Ash-Harness"
Issues = "https://github.com/Suraj-H675/Ash-Harness/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.ruff]
extend-exclude = ["project"]
