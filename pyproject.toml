[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ash"
version = "0.1.0"
description = "Ash coding harness"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.52",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "loguru>=0.7",
    "numpy>=2.0",
    "openai>=1.82",
    "packaging>=24.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "prompt-toolkit>=3.0.51",
    "rich>=13.0",
    "tiktoken>=0.7",
    "toml>=0.10",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "uvicorn>=0.34",
    "websockets>=15.0",
]

[project.scripts]
ash = "ash.cli:main"

[tool.setuptools]
packages = ["ash", "agents", "cli", "context", "core", "hooks", "lsp", "mcp", "memory", "plugins", "providers", "repo", "safety", "sandbox", "server", "tools", "ui"]
py-modules = ["ash_logging", "config", "exceptions"]

[tool.uv]
package = true

[project.optional-dependencies]
dev = [
    "mypy>=1.16",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.11",
]
vector = [
    "chromadb>=1.0",
    "onnxruntime>=1.16",
]

[project.urls]
Repository = "https://github.com/Suraj-H675/Ash-Harness"
Issues = "https://github.com/Suraj-H675/Ash-Harness/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
