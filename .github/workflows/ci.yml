name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --extra server --extra browser --extra acp --extra a2a
      - run: uv run ruff check src tests
      - run: uv run mypy src/ash
      - run: uv run pytest -q --timeout=120
      - run: uv build
      - name: Installed CLI smoke test
        shell: bash
        run: |
          uv venv .smoke-venv --python ${{ matrix.python-version }}
          uv pip install --python .smoke-venv dist/*.whl
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .smoke-venv/Scripts/python.exe tests/packaging/smoke_minimal_install.py
          else
            .smoke-venv/bin/python tests/packaging/smoke_minimal_install.py
          fi
