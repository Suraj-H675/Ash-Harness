name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy ash cli config.py context core hooks mcp plugins providers safety sandbox tools ui
      - run: uv run pytest -q
      - run: uv build
      - name: Installed CLI smoke test
        shell: bash
        run: |
          uv venv .smoke-venv --python 3.12
          uv pip install --python .smoke-venv dist/*.whl
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .smoke-venv/Scripts/ash.exe --version
            .smoke-venv/Scripts/python.exe -m ash --help
          else
            .smoke-venv/bin/ash --version
            .smoke-venv/bin/python -m ash --help
          fi
