name: Windows Compatibility

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Windows test slice"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - first-failure
          - providers
          - agents
          - automation
          - installer

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --extra server --extra browser --extra acp --extra a2a
      - run: uv run ruff check src tests
      - run: uv run mypy src/ash
      - name: Run tests
        shell: pwsh
        run: |
          $mode = "${{ inputs.test_mode }}"
          if (-not $mode) { $mode = "full" }
          switch ($mode) {
            "first-failure" {
              uv run pytest -x -vv --tb=long --timeout=120 --timeout-method=thread
            }
            "providers" {
              uv run pytest -vv --tb=long --timeout=120 --timeout-method=thread tests/e2e/test_anthropic_provider_process.py tests/e2e/test_builtin_cloud_provider_process.py tests/e2e/test_local_openai_compatible_process.py
            }
            "agents" {
              uv run pytest -vv --tb=long --timeout=120 --timeout-method=thread tests/integration/test_subagents.py tests/unit/test_agent_tool.py tests/unit/test_agent_worktree.py
            }
            "automation" {
              uv run pytest -vv --tb=long --timeout=120 --timeout-method=thread tests/unit/test_automation.py
            }
            "installer" {
              uv run pytest -vv --tb=long --timeout=120 --timeout-method=thread tests/unit/test_installer.py
            }
            default {
              uv run pytest -v --timeout=120 --timeout-method=thread
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: uv build
      - name: Installed CLI smoke test
        shell: bash
        run: |
          uv venv .smoke-venv --python ${{ matrix.python-version }}
          uv pip install --python .smoke-venv dist/*.whl
          .smoke-venv/Scripts/python.exe tests/packaging/smoke_minimal_install.py
